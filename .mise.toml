# Global mise configuration — installed to ~/.config/mise/conf.d/10-dotfiles.toml
# by install.sh. It declares what a machine gets: tools, environment, and the
# setup tasks that install everything mise itself cannot. install.sh is only a
# thin bootstrapper (install mise → download this file → `mise install` →
# `mise run setup`), and the tasks at the bottom are a facade over the scripts
# in .dotfiles/setup/ rather than the shell that does the work.
#
# conf.d rather than ~/.config/mise/config.toml so that re-running install.sh
# has nothing machine-local to overwrite: mise merges both, and config.toml
# wins, which leaves it free for this-machine-only tools, pins and settings.

# Tools track `latest` here, but `latest` is not what gets installed: mise.lock
# pins an exact version and checksum for every one of them, and a locked version
# always wins over a fuzzy selector like `latest`. So this file says "follow
# upstream" while the lockfile decides when that actually happens.
#
# The lockfile is advanced by .github/workflows/bump-tools.yml, daily, with
# `mise lock --bump --minimum-release-age 2d`. That flag only considers
# releases that are at least two days old, which closes the window in which a
# compromised release would be picked up — the first hours after publish, when
# supply-chain worms do their damage. It applies to fuzzy selectors only, which
# is exactly why the versions below stay `latest` rather than being pinned here.
#
# Every entry is written as an inline table — including the ones whose only key
# is `version`. Two reasons to keep that uniform. TOML closes the `[tools]`
# table as soon as a `[tools.<name>]` sub-table appears, so any bare key written
# after one becomes a key of *that tool* instead of a new tool; ten tools were
# silently never installed that way. And with no mix of styles there is no
# question of which form a new tool should use, or where in the block it goes.
# Inline tables must stay on a single line: multi-line ones are TOML 1.1, which
# non-mise parsers reject and `mise fmt` reorders.
#
# The postinstall hooks below are the one place shell still belongs in this
# file: they run during `mise install`, before any task, so they cannot be
# delegated to a script that a task downloads.
[tools]
node = { version = "latest" }
"npm:pnpm" = { version = "latest" }
bun = { version = "latest" }
ghq = { version = "latest" }
jq = { version = "latest" }
pinact = { version = "latest" }
uv = { version = "latest" }
"cargo:similarity-ts" = { version = "latest" }
"npm:@antfu/ni" = { version = "latest" }
"npm:@openai/codex" = { version = "latest" }
opencode = { version = "latest" }
oci = { version = "latest" }
cloudflared = { version = "latest" }
wrangler = { version = "latest" }
hunk = { version = "latest" }
github-cli = { version = "latest", postinstall = "gh extension install github/gh-stack 2>/dev/null || gh extension upgrade stack 2>/dev/null || true" }
# `depends = ["node"]` on the npm: tools below: their postinstall shells out to
# `npx`, which only exists once node is installed. Without the explicit
# dependency mise may run it while node is still being (re)installed — `mise
# upgrade` then fails the postinstall with exit code 127.
#
# ctx7: `ctx7 setup` blocks on an interactive OAuth device-code prompt that
# neither --yes nor CI=true suppresses; only --api-key skips it. Pass the flag
# when CONTEXT7_API_KEY is set (CI) and otherwise keep the interactive sign-in.
"npm:ctx7" = { version = "latest", depends = ["node"], postinstall = "npx ctx7@latest setup --cli --claude --opencode --cursor --codex --yes ${CONTEXT7_API_KEY:+--api-key \"$CONTEXT7_API_KEY\"}" }
# playwright-cli is deprecated; use @playwright/cli. Note that the version
# series restarted with the rename, so the current 0.1.x is newer than the
# 0.262.0 that the old playwright-cli package left behind on some machines.
"npm:@playwright/cli" = { version = "latest", depends = ["node"], postinstall = "npx skills add microsoft/playwright-cli -y -g -a claude-code -a opencode -a cursor -a codex" }
"npm:difit" = { version = "latest", depends = ["node"], postinstall = "npx skills add yoshiko-pg/difit -y -g -a claude-code -a opencode -a cursor -a codex" }
# rtk init writes into each agent's config dir and fails outright if the dir is
# missing, so create all three up front. On a fresh machine (and in CI) nothing
# else has necessarily created ~/.cursor yet.
#
# The Codex run is the exception on both counts, and deliberately shaped
# differently. `--codex` writes ~/.codex/RTK.md and an @-reference to it from
# ~/.codex/AGENTS.md rather than patching a settings.json, so rtk rejects
# `--codex --auto-patch` outright ("cannot be combined") — there is nothing to
# patch and nothing to prompt about, which is also why it needs no directory
# created for it.
"github:rtk-ai/rtk" = { version = "latest", postinstall = "mkdir -p \"$HOME/.claude\" \"$HOME/.cursor\" \"$HOME/.config/opencode\" && rtk init -g --auto-patch && rtk init -g --opencode --auto-patch && rtk init -g --agent cursor --auto-patch && rtk init -g --codex" }

[env]
# Claude Code installs to ~/.local/bin; make it visible to setup tasks and
# any shell where mise is activated.
_.path = ["{{env.HOME}}/.local/bin"]

[hooks]
# Run after `mise install` (no shell activation required); keeps git defaults
# colocated with tool config instead of scripted in install.sh.
postinstall = "git config --global init.defaultBranch main"

[settings]
# Auto-install tools when entering directories with .tool-versions or .mise.toml
auto_install = true

# Re-run cryptographic provenance verification at install time for artifacts
# whose backend provides it, even when mise.lock already records verification.
locked_verify_provenance = true

# Keep mise experimental features disabled
experimental = false

# --- Setup tasks ------------------------------------------------------------
# Everything below used to live in install.sh, then here as inline shell. Now
# each task carries only its name, description and dependencies, and
# `setup:<name>` runs `.dotfiles/setup/<name>.sh` from the repository. Re-run
# the whole setup with `mise run setup`, or one piece with `mise run
# setup:skills`.
#
# The bodies moved out because this file cannot be reviewed the way a shell
# script can. install.sh downloads it as a single file, so shell written here
# arrives as a TOML string that ShellCheck never sees, `bash -n` never parses
# and a test can only reach by re-parsing the TOML. As separate files they are
# ordinary scripts: CI lints and syntax-checks them, tests run them directly,
# and `bash .dotfiles/setup/claude.sh` reproduces exactly what a machine does.
#
# setup:scripts is what makes that work on a machine that has only this file.
# Every task below depends on it, so a single task pulls in what it needs.
#
# Tasks that download from this repository take their base URL from
# DOTFILES_RAW_BASE, which install.sh exports after resolving the repository to
# a single commit SHA. That is what keeps one installation from mixing files
# from either side of a merge that lands while it runs.
#
# Run on its own — `mise run setup:claude` on a machine set up months ago —
# there is no such variable, and the tasks fall back to `main`. Resolving a SHA
# per task would buy nothing: tasks invoked separately are separate events, so
# there is no run for them to be consistent within, and the fallback would spend
# an unauthenticated API call (60/hour, shared per IP) on every task to answer a
# question nobody asked. Atomicity is a property of a bootstrap run, and
# install.sh is where a bootstrap run exists.

[tasks.setup]
description = "Run the full dotfiles setup (Claude Code, skills, plugins)"
depends = [
  "setup:npm-registry",
  "setup:claude",
  "setup:skills",
  "setup:codex",
  "setup:claude-plugins",
  "setup:git-hooks",
  "setup:update-notice",
]

[tasks."setup:scripts"]
description = "Place the setup scripts the tasks below delegate to"
shell = "bash -c"
run = '''
set -euo pipefail
RAW_BASE="${DOTFILES_RAW_BASE:-https://raw.githubusercontent.com/bmthd/dotfiles/${DOTFILES_REF:-main}}"
# ~/.cache, not ~/.config/dotfiles: these are a copy of what the repository
# publishes, replaced on every run and carrying nothing of this machine's.
# ~/.config/dotfiles holds the opposite kind of file — the ones `/dotfiles
# apply` three-way merges because local edits there are meant to survive.
SETUP_DIR="$HOME/.cache/dotfiles/setup"
# Every task below by name: `setup:<name>` runs `<name>.sh`. A task added
# without its name here would point at a script that never arrives, which is
# what tests/setup-facade-test.sh exists to catch.
SCRIPTS=(npm-registry oci-plugin claude skills codex claude-plugins git-hooks update-notice)
mkdir -p "$SETUP_DIR"
failures=0
for name in "${SCRIPTS[@]}"; do
    # Into a temp file first: `curl -f -o dest` creates and partially fills dest
    # before it gives up on an error response, and a half-written script that a
    # task then executes is worse than one that never downloaded.
    tmp="$(mktemp)"
    if curl -fsSL --max-time 30 "$RAW_BASE/.dotfiles/setup/$name.sh" -o "$tmp"; then
        # mktemp creates the file 0600, so set the mode outright rather than
        # adding +x to it and leaving a script only its owner can read.
        chmod 755 "$tmp"
        mv "$tmp" "$SETUP_DIR/$name.sh"
    else
        rm -f "$tmp"
        echo "⚠ Failed to download the $name setup script"
        failures=$((failures + 1))
    fi
done
if [ "$failures" -gt 0 ]; then
    # Fail closed, and with it every task depending on this one. Falling back to
    # last run's copy would run a script this config was never checked against,
    # and every task here needs the network for its own work anyway.
    echo "✗ $failures setup script(s) could not be downloaded from $RAW_BASE"
    exit 1
fi
'''

[tasks."setup:oci-plugin"]
description = "Migrate the OCI plugin from the legacy asdf backend to vfox"
depends = ["setup:scripts"]
run = "$HOME/.cache/dotfiles/setup/oci-plugin.sh"

[tasks."setup:npm-registry"]
description = "Route npm installs through the Takumi Guard malware-blocking proxy"
depends = ["setup:scripts"]
run = "$HOME/.cache/dotfiles/setup/npm-registry.sh"

[tasks."setup:git-hooks"]
description = "Install the global git hooks that trust mise configs in new worktrees"
depends = ["setup:scripts"]
run = "$HOME/.cache/dotfiles/setup/git-hooks.sh"

[tasks."setup:update-notice"]
description = "Install the shell-startup dotfiles update notification"
depends = ["setup:scripts"]
run = "$HOME/.cache/dotfiles/setup/update-notice.sh"

[tasks."setup:claude"]
description = "Install Claude Code plus its settings.json and status line"
depends = ["setup:scripts"]
run = "$HOME/.cache/dotfiles/setup/claude.sh"

[tasks."setup:skills"]
description = "Install agent skills for Claude Code, OpenCode, Cursor, and Codex"
# The `npx skills add` calls in the script must resolve through the Takumi Guard
# proxy, so make the registry configuration an explicit dependency rather than
# relying on the order of the parent task's depends list.
depends = ["setup:scripts", "setup:npm-registry"]
run = "$HOME/.cache/dotfiles/setup/skills.sh"

[tasks."setup:codex"]
description = "Install the official Codex plugin for Claude Code"
depends = ["setup:scripts", "setup:claude"]
run = "$HOME/.cache/dotfiles/setup/codex.sh"

[tasks."setup:claude-plugins"]
description = "Install official Anthropic plugins for Claude Code (TypeScript LSP)"
depends = ["setup:scripts", "setup:claude"]
run = "$HOME/.cache/dotfiles/setup/claude-plugins.sh"
