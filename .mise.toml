# Global mise configuration — installed to ~/.config/mise/config.toml by
# install.sh. Tools, environment, and setup tasks all live here; install.sh
# is only a thin bootstrapper (install mise → download this file →
# `mise install` → `mise run setup`).

# Tools track `latest` here, but `latest` is not what gets installed: mise.lock
# pins an exact version and checksum for every one of them, and a locked version
# always wins over a fuzzy selector like `latest`. So this file says "follow
# upstream" while the lockfile decides when that actually happens.
#
# The lockfile is advanced by .github/workflows/bump-tools.yml, daily, with
# `mise lock --bump --minimum-release-age 2d`. That flag only considers
# releases that are at least two days old, which closes the window in which a
# compromised release would be picked up — the first hours after publish, when
# supply-chain worms do their damage. It applies to fuzzy selectors only, which
# is exactly why the versions below stay `latest` rather than being pinned here.
[tools]
node = "latest"
"npm:pnpm" = "latest"
bun = "latest"
ghq = "latest"
jq = "latest"
uv = "latest"
"cargo:similarity-ts" = "latest"
"npm:@antfu/ni" = "latest"
"npm:@openai/codex" = "latest"
opencode = "latest"
oci = "latest"
cloudflared = "latest"
wrangler = "latest"

# NOTE: keep every plain `tool = "version"` entry above this line. A
# `[tools.<name>]` table ends the `[tools]` table, so bare keys written after
# one become keys of *that tool* instead of new tools. ghq, jq, uv,
# similarity-ts, @antfu/ni, @openai/codex, opencode, oci, cloudflared and
# wrangler all sat under `[tools.github-cli]` and were silently never
# installed.
[tools.github-cli]
version = "latest"
postinstall = "gh extension install github/gh-stack 2>/dev/null || gh extension upgrade stack 2>/dev/null || true"

[tools."npm:ctx7"]
version = "latest"
# The postinstall shells out to `npx`, which only exists once node is installed.
# Without an explicit dependency mise may run it while node is still being
# (re)installed — `mise upgrade` then fails the postinstall with exit code 127.
depends = ["node"]
# `ctx7 setup` blocks on an interactive OAuth device-code prompt that neither
# --yes nor CI=true suppresses; only --api-key skips it. Pass the flag when
# CONTEXT7_API_KEY is set (CI) and otherwise keep the interactive sign-in.
postinstall = "npx ctx7@latest setup --cli --claude --opencode --cursor --yes ${CONTEXT7_API_KEY:+--api-key \"$CONTEXT7_API_KEY\"}"

# playwright-cli is deprecated; use @playwright/cli. Note that the version
# series restarted with the rename, so the current 0.1.x is newer than the
# 0.262.0 that the old playwright-cli package left behind on some machines.
[tools."npm:@playwright/cli"]
version = "latest"
# `npx` comes from node; see the note on npm:ctx7
depends = ["node"]
postinstall = "npx skills add microsoft/playwright-cli -y -g -a claude-code -a opencode -a cursor"

[tools."npm:difit"]
version = "latest"
# `npx` comes from node; see the note on npm:ctx7
depends = ["node"]
postinstall = "npx skills add yoshiko-pg/difit -y -g -a claude-code -a opencode -a cursor"

[tools."github:rtk-ai/rtk"]
version = "latest"
# rtk init writes into each agent's config dir and fails outright if the dir
# is missing, so create all three up front. On a fresh machine (and in CI)
# nothing else has necessarily created ~/.cursor yet.
postinstall = "mkdir -p \"$HOME/.claude\" \"$HOME/.cursor\" \"$HOME/.config/opencode\" && rtk init -g --auto-patch && rtk init -g --opencode --auto-patch && rtk init -g --agent cursor --auto-patch"

[env]
# Claude Code installs to ~/.local/bin; make it visible to setup tasks and
# any shell where mise is activated.
_.path = ["{{env.HOME}}/.local/bin"]

[hooks]
# Run after `mise install` (no shell activation required); keeps git defaults
# colocated with tool config instead of scripted in install.sh.
postinstall = "git config --global init.defaultBranch main"

[settings]
# Auto-install tools when entering directories with .tool-versions or .mise.toml
auto_install = true

# Use latest stable versions
experimental = false

# --- Setup tasks ------------------------------------------------------------
# Everything below used to live in install.sh. Re-run the whole setup any
# time with `mise run setup`, or a single piece (e.g. `mise run setup:skills`).

[tasks.setup]
description = "Run the full dotfiles setup (Claude Code, skills, plugins)"
depends = [
  "setup:npm-registry",
  "setup:claude",
  "setup:skills",
  "setup:codex",
  "setup:claude-plugins",
  "setup:update-notice",
]

[tasks."setup:npm-registry"]
description = "Route npm installs through the Takumi Guard malware-blocking proxy"
shell = "bash -c"
run = '''
# Point npm at Takumi Guard (https://npm.flatt.tech/), a proxy that refuses to
# serve packages it knows to be malicious. Anonymous mode ("Tier A") needs no
# account: blocking only, no audit log.
#
# This covers the part of the supply chain that pinning cannot. The mise `npm:`
# tools resolve to a pinned version and Renovate holds new ones back, but the
# postinstall hooks below shell out to `npx ctx7@latest` and `npx skills add`,
# which always fetch the newest package at run time. The proxy is the only
# control that sits in front of those.
#
# It is written to ~/.npmrc, not exported as NPM_CONFIG_REGISTRY, so that a
# project-level .npmrc (a work repo on a private registry) still wins — npm
# reads env vars at a higher precedence than any .npmrc file.
NPMRC="$HOME/.npmrc"
REGISTRY="https://npm.flatt.tech/"
touch "$NPMRC"
current="$(sed -n 's/^registry=//p' "$NPMRC" | tail -1)"
case "$current" in
    "$REGISTRY")
        echo "✓ npm registry already points at Takumi Guard"
        ;;
    ""|https://registry.npmjs.org*)
        # No registry line, or still the npm default: safe to (re)write.
        tmp="$(mktemp)"
        grep -v '^registry=' "$NPMRC" > "$tmp" || true
        printf 'registry=%s\n' "$REGISTRY" >> "$tmp"
        cat "$tmp" > "$NPMRC"
        rm -f "$tmp"
        echo "✓ npm registry set to Takumi Guard ($REGISTRY)"
        ;;
    *)
        # Somebody pointed ~/.npmrc at a registry of their own; leave it alone.
        echo "⚠ ~/.npmrc already uses a custom registry ($current); leaving it unchanged"
        ;;
esac
'''

[tasks."setup:update-notice"]
description = "Install the shell-startup dotfiles update notification"
shell = "bash -c"
run = '''
DOTFILES_CONFIG_DIR="$HOME/.config/dotfiles"
UPDATE_NOTICE="$DOTFILES_CONFIG_DIR/update-notice.sh"
mkdir -p "$DOTFILES_CONFIG_DIR"
if curl -fsSL https://raw.githubusercontent.com/bmthd/dotfiles/main/.dotfiles/update-notice.sh -o "$UPDATE_NOTICE"; then
    bash "$UPDATE_NOTICE" install
    echo "✓ Dotfiles update notification installed"
else
    echo "⚠ Failed to install dotfiles update notification"
fi
'''

[tasks."setup:claude"]
description = "Install Claude Code plus its settings.json and status line"
shell = "bash -c"
run = '''
# Install Claude Code via the official installer (not mise/npm, which cannot
# complete the native binary postinstall)
if ! command -v claude &> /dev/null; then
    echo "📦 Installing Claude Code..."
    if curl -fsSL https://claude.ai/install.sh | bash; then
        echo "✓ Claude Code installed"
    else
        echo "⚠ Claude Code installation failed; skipping"
    fi
else
    echo "✓ Claude Code is already installed"
fi

echo "📦 Setting up Claude Code configuration..."
mkdir -p "$HOME/.claude/skills"
CLAUDE_SETTINGS="$HOME/.claude/settings.json"
REMOTE_SETTINGS="$(mktemp)"
if curl -fsSL https://raw.githubusercontent.com/bmthd/dotfiles/main/.claude/settings.json -o "$REMOTE_SETTINGS"; then
    if [ -f "$CLAUDE_SETTINGS" ] && command -v jq &> /dev/null; then
        # Deep-merge remote settings into existing ones (remote wins on conflicts)
        MERGED_SETTINGS="$(mktemp)"
        if jq -s '.[0] * .[1]' "$CLAUDE_SETTINGS" "$REMOTE_SETTINGS" > "$MERGED_SETTINGS" 2>/dev/null; then
            mv "$MERGED_SETTINGS" "$CLAUDE_SETTINGS"
            echo "✓ Merged Claude Code settings into existing $CLAUDE_SETTINGS"
        else
            rm -f "$MERGED_SETTINGS"
            echo "⚠ Failed to merge settings; keeping existing $CLAUDE_SETTINGS unchanged"
        fi
    else
        mv "$REMOTE_SETTINGS" "$CLAUDE_SETTINGS"
        echo "✓ Installed Claude Code settings to $CLAUDE_SETTINGS"
    fi
else
    echo "⚠ Failed to download Claude Code settings"
fi
rm -f "$REMOTE_SETTINGS"

if curl -fsSL https://raw.githubusercontent.com/bmthd/dotfiles/main/.claude/statusline.sh -o "$HOME/.claude/statusline.sh"; then
    chmod +x "$HOME/.claude/statusline.sh"
    echo "✓ Claude Code status line installed"
else
    echo "⚠ Failed to download Claude Code status line"
fi
'''

[tasks."setup:skills"]
description = "Install agent skills for Claude Code, OpenCode, and Cursor"
# The `npx skills add` calls below must resolve through the Takumi Guard proxy,
# so make the registry configuration an explicit dependency rather than relying
# on the order of the parent task's depends list.
depends = ["setup:npm-registry"]
shell = "bash -c"
run = '''
# Skill directories for each agent CLI (Cursor reads ~/.agents/skills)
mkdir -p "$HOME/.claude/skills" "$HOME/.config/opencode/skills" "$HOME/.agents/skills"

# Install skills via the `skills` CLI — one mechanism for every source.
# Own skills live in bmthd/skills, split out of this repo so they can be shared
# on their own. What stays in this repo's .agents/skills/ is what does not
# belong anywhere else: update-dotfiles, which only makes sense against this
# repo. Third-party skills come from their upstream repos. productivity pulls
# all skills from Matt Pocock's upstream productivity skills folder.
# mathbullet contributes html and explain, the two skills html's SKILL.md
# recommends using together. The other two it recommends, japanese-tech-writing
# and cognitive-rhythm-writing, are published as gists and are fetched from
# there directly. Skills cross-reference each other by name, so all four
# resolve once they share an agent's skills directory.
# Update any of them later with `npx skills update`.
#
# SECURITY: these are the one dependency here that nothing checks. A skill is
# Markdown that is loaded straight into every agent's context, so a compromised
# one is a prompt-injection channel, not just a malicious package — and the
# skills CLI has no way to pin a revision (`skills add` takes no ref, and the
# skills-lock.json restore path is experimental and project-scoped). Treat
# `npx skills update` as a change to review, not to run unattended.
echo "📦 Installing skills..."
install_skills() {
    local label="$1"; shift
    npx skills add "$@" -y -g -a claude-code -a opencode -a cursor 2>/dev/null \
      && echo "✓ $label skills installed" \
      || echo "⚠ $label skills installation failed (continuing)"
}
install_skills "own" bmthd/skills
# update-dotfiles targets this repository, so it still lives here
install_skills "dotfiles-local" bmthd/dotfiles
install_skills "superpowers" obra/superpowers
install_skills "productivity" https://github.com/mattpocock/skills/tree/main/skills/productivity -s '*'
install_skills "mathbullet" mathbullet/skills -s html -s explain
# japanese-tech-writing and cognitive-rhythm-writing are Keiichiro Shikano's
# (k16shikano) gists:
# https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d
# https://gist.github.com/k16shikano/eb2929f13ed19c97188393d297be8432
# Use the .git clone URL, not the page URL: the skills CLI source parser
# mistakes gist.github.com for github.com and the page URL 404s.
install_skills "japanese-tech-writing" https://gist.github.com/fd287c3133457c4fd8f5601d34aa817d.git
install_skills "cognitive-rhythm-writing" https://gist.github.com/eb2929f13ed19c97188393d297be8432.git
'''

[tasks."setup:codex"]
description = "Install the official Codex plugin for Claude Code"
depends = ["setup:claude"]
shell = "bash -c"
run = '''
echo "📦 Setting up Codex plugin..."
if command -v claude &> /dev/null; then
    claude plugin marketplace add openai/codex-plugin-cc 2>/dev/null \
      && claude plugin install codex@openai-codex -s user 2>/dev/null \
      && echo "✓ Codex plugin installed" \
      || echo "⚠ Codex plugin installation failed (continuing)"
else
    echo "⚠ claude not found on PATH; skipping Codex plugin installation"
fi
'''

[tasks."setup:claude-plugins"]
description = "Install official Anthropic plugins for Claude Code (TypeScript LSP)"
depends = ["setup:claude"]
shell = "bash -c"
run = '''
echo "📦 Setting up official Claude Code plugins..."
if ! command -v claude &> /dev/null; then
    echo "⚠ claude not found on PATH; skipping official plugin installation"
    exit 0
fi

# 公式マーケットプレイスは登録済みでも add は失敗しないが、念のため結果を握り潰す
claude plugin marketplace add anthropics/claude-plugins-official 2>/dev/null || true

# インストール対象の公式プラグイン。増やす場合はここに追記する
OFFICIAL_PLUGINS=(
    typescript-lsp
)
for plugin in "${OFFICIAL_PLUGINS[@]}"; do
    claude plugin install "$plugin@claude-plugins-official" -s user 2>/dev/null \
      && echo "✓ $plugin installed" \
      || echo "⚠ $plugin installation failed (continuing)"
done
'''
