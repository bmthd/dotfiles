name: Quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch a locked version that has been yanked, or a checksum that no longer
    # matches its artifact, before a machine does. Runs after bump-tools.yml so
    # it checks the day's freshly locked versions.
    - cron: "17 4 * * *"

jobs:
  mise-doctor:
    name: Mise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Resolving the `npm:` tools below reaches the npm registry, so send that
      # traffic through the same malware-blocking proxy the installed machines
      # use. Anonymous mode needs no bot-id and no extra permissions.
      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - name: Validate tool config parses
        run: mise ls
      - name: Validate setup tasks parse
        run: mise tasks ls
      - name: Verify every locked version still resolves
        # Plain `mise lock` (no --bump) refreshes metadata for the versions
        # already in the lockfile rather than advancing them, and resolves URLs
        # and checksums without installing — so this checks all 20 locked
        # versions without running any postinstall hook (ctx7's blocks on an
        # interactive login when CONTEXT7_API_KEY is absent, which it is here).
        run: mise lock --dry-run
      - name: Test tool pins and lockfile
        run: bash tests/mise-pins-test.sh
      - name: Verify immutable GitHub Actions references
        run: mise x pinact -- pinact run -check -verify-comment
        env:
          GITHUB_TOKEN: ${{ github.token }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n .claude/statusline.sh
          bash -n .dotfiles/update-notice.sh
          bash -n .dotfiles/git-hooks/dispatch
          bash -n .dotfiles/git-hooks/install.sh
      - name: zsh -n
        # install.sh is documented to run under zsh too (see README), so
        # verify it parses cleanly there in addition to bash.
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -n install.sh
      - name: Test update notification
        run: bash tests/update-notice-test.sh
      - name: Test status line
        run: bash tests/statusline-test.sh
      - name: Test install ordering
        run: bash tests/install-order-test.sh
      - name: Test global git hooks
        run: bash tests/git-hooks-test.sh
