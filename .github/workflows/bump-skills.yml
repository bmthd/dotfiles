name: Bump skills

# Advances .dotfiles/apm/apm.lock.yaml — the commits every third-party skill is
# installed from — and opens a PR with it. Weekly rather than daily: a skill is
# reviewed by reading its upstream diff, and that is a batch worth doing once a
# week, not a stream.
#
# The token is the same bypass-listed App that bump-tools.yml uses, for two
# reasons: a PR opened with the default GITHUB_TOKEN does not trigger the
# Quality workflow, and the App can push the bump-skills branch. Opening the
# PR additionally needs the App's Pull requests: Read and write permission; see
# docs/supply-chain.md.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-skills
  cancel-in-progress: false

jobs:
  bump:
    name: Bump locked skills
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for the bypass-listed App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Re-resolve every skill to upstream HEAD
        # Only apm, at the version mise.lock pins; the other tools are not needed.
        run: mise x apm -- bash .dotfiles/apm/relock.sh --update

      - name: Open or update the PR
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/workflows/bump-skills.pr.sh
